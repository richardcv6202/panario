<html lang="es">
<head>
    <meta charset="UTF-8">

         🆕 v2.3.9: METADATOS DE LA APP

    <meta name="author" content="Ricardo Castillo Valdés">
    <meta name="theme-color" content="#f5a623">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Panario">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Panario - Sistema de Gestión">
    <meta property="og:description" content="Sistema de gestión para panadería artesanal. Offline-first.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/icon-512.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Panario - Sistema de Gestión">
    <meta name="twitter:description" content="Sistema de gestión para panadería artesanal. Offline-first.">
    <meta name="twitter:image" content="./assets/icon-512.png">
    
    <title>Panario - Panadería Artesanal</title>

         FAVICONS
         ============================================================ -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon16.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon32.ico">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    
    <!-- ============================================================
         MANIFEST PWA
         ============================================================ -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- ============================================================
         ESTILOS
         ============================================================ -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- ============================================================
         PRELOAD DE ASSETS CRÍTICOS
         ============================================================ -->
    <link rel="preload" href="./lib/sql-wasm.wasm" as="fetch" type="application/wasm" crossorigin>
    <link rel="preload" href="./js/app.js" as="script">
    <link rel="preload" href="./js/db.js" as="script">
    
    <!-- ============================================================
         SCRIPTS - LIBRERÍAS EXTERNAS (deben ir PRIMERO)
         ============================================================ -->
    <script src="./lib/sql-wasm.js"></script>
    <script src="./lib/qrcode.js"></script>
</head>
<body>

    <!-- ============================================================
         PANTALLA DE LOGIN/REGISTRO
         ============================================================ -->
    <div id="authScreen" class="screen active">
        <div class="auth-wrapper">
            <div class="auth-container">
                <div class="auth-header">
                    <span class="logo">🍞</span>
                    <h1>Panario</h1>
                    <p class="subtitle">Tu panadería en orden</p>
                </div>
                
                <!-- LOGIN FORM -->
                <form id="loginForm" class="auth-form" style="display: flex;">
                    <div class="form-group">
                        <label for="loginUser">👤 Usuario</label>
                        <input type="text" id="loginUser" placeholder="nombre_usuario" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPass">🔒 Contraseña</label>
                        <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password" required>
                    </div>
                    <button type="button" id="loginBtn" class="btn primary">🔑 Iniciar sesión</button>
                    <div id="loginError" class="error"></div>
                    <p style="text-align: center; font-size: 13px; color: var(--text-light); margin-top: 8px;">
                        ¿No tienes cuenta?
                        <span id="showRegisterBtn" style="color: var(--primary); cursor: pointer; font-weight: 600;">Crear una</span>
                    </p>
                </form>
                
                <!-- REGISTER FORM -->
                <form id="registerForm" class="auth-form" style="display: none;">
                    <div class="form-group">
                        <label for="regUser">👤 Usuario</label>
                        <input type="text" id="regUser" placeholder="nombre_usuario" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="regPass">🔒 Contraseña</label>
                        <input type="password" id="regPass" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="regName">📛 Nombre completo</label>
                        <input type="text" id="regName" placeholder="Tu nombre" required>
                    </div>
                    
                    <!-- Selección de modo de negocio -->
                    <div class="form-group">
                        <label>🏢 Modo de negocio</label>
                        <div style="display: flex; gap: 8px; margin-top: 4px;">
                            <label class="negocio-mode-option" onclick="selectNegocioMode('crear')" 
                                   style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--primary-light); border: 2px solid var(--primary); border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                                <input type="radio" name="negocioMode" value="crear" checked style="cursor: pointer;">
                                <span style="font-size: 13px;">✨ Crear nuevo</span>
                            </label>
                            <label class="negocio-mode-option" onclick="selectNegocioMode('unirse')" 
                                   style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--bg); border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                                <input type="radio" name="negocioMode" value="unirse" style="cursor: pointer;">
                                <span style="font-size: 13px;">🔗 Unirme</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Nombre del negocio (modo crear) -->
                    <div class="form-group" id="negocio-name-group">
                        <label for="regBusiness">🏪 Nombre del negocio</label>
                        <input type="text" id="regBusiness" placeholder="Ej: Panadería El Trigal">
                    </div>
                    
                    <!-- Código de invitación (modo unirse) -->
                    <div class="form-group" id="negocio-code-group" style="display: none;">
                        <label for="regCodigo">🔑 Código de invitación</label>
                        <input type="text" id="regCodigo" placeholder="ABC12345" maxlength="8" 
                               style="text-transform: uppercase; letter-spacing: 2px; text-align: center; font-weight: 600;"
                               oninput="previewNegocio(this.value)">
                        <div id="negocio-preview" style="margin-top: 6px; font-size: 12px;"></div>
                    </div>
                    
                    <button type="button" id="registerBtn" class="btn primary">✨ Crear cuenta</button>
                    <div id="registerError" class="error"></div>
                    <p style="text-align: center; font-size: 13px; color: var(--text-light); margin-top: 8px;">
                        ¿Ya tienes cuenta?
                        <span id="showLoginBtn" style="color: var(--primary); cursor: pointer; font-weight: 600;">Iniciar sesión</span>
                    </p>
                </form>
                
                <div class="auth-footer">
                    © 2026 Ricardo Castillo Valdés · v2.3.9
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         PANTALLA PRINCIPAL DE LA APP
         ============================================================ -->
    <div id="appScreen" class="screen">
        <!-- HEADER -->
        <header>
            <h1>🍞 Panario</h1>
            <span id="userDisplay" onclick="toggleUserMenu()">👤 Usuario</span>
            <!-- 🆕 v2.3.9 (#2): Añadido id="notification-bell" para que notifications.js lo encuentre -->
            <button class="icon-btn" id="notification-bell" onclick="showNotificationsModal()" title="Notificaciones" 
                    style="position: relative;">
                🔔
                <!-- 🆕 v2.3.9 (#2): Cambiado id="notificationBadge" a id="bell-badge" (kebab-case, coincide con notifications.js) -->
                <span id="bell-badge" 
                      style="display: none; position: absolute; top: -2px; right: -2px; 
                             background: var(--danger); color: #fff; font-size: 10px; 
                             font-weight: 700; padding: 1px 5px; border-radius: 10px; 
                             min-width: 16px; text-align: center;">0</span>
            </button>
            <button class="icon-btn" onclick="showHelpMenu()" title="Ayuda">❓</button>
            <!-- 🆕 v2.3.8 (#1): Botón de Cerrar Sesión en el header -->
            <button class="icon-btn" onclick="handleLogout()" title="Cerrar sesión" id="header-logout-btn">🚪</button>
        </header>
        
        <!-- MENÚ DE USUARIO -->
        <div id="userMenu" 
             style="display: none; position: fixed; top: 60px; right: 16px; 
                    background: var(--bg-card); border-radius: var(--radius); 
                    box-shadow: var(--shadow-hover); padding: 8px; min-width: 200px; 
                    z-index: 9999;">
            <div style="padding: 8px 12px; border-bottom: 1px solid var(--border-color);">
                <div id="menuUserName" style="font-weight: 600; font-size: 14px;">Usuario</div>
                <div id="menuUserEmail" style="font-size: 11px; color: var(--text-light);">correo@ejemplo.com</div>
            </div>
            <button onclick="window.navigate('profile'); toggleUserMenu();" 
                    style="display: block; width: 100%; text-align: left; padding: 10px 12px; 
                           background: none; border: none; cursor: pointer; font-size: 14px; 
                           border-radius: 6px; transition: background 0.2s;">
                👤 Mi Perfil
            </button>
            <button onclick="window.navigate('settings'); toggleUserMenu();" 
                    style="display: block; width: 100%; text-align: left; padding: 10px 12px; 
                           background: none; border: none; cursor: pointer; font-size: 14px; 
                           border-radius: 6px; transition: background 0.2s;">
                ⚙️ Herramientas
            </button>
            <button onclick="handleLogout()" 
                    style="display: block; width: 100%; text-align: left; padding: 10px 12px; 
                           background: none; border: none; cursor: pointer; font-size: 14px; 
                           color: var(--danger); border-radius: 6px; transition: background 0.2s;">
                🚪 Cerrar sesión
            </button>
        </div>
        
        <!-- CONTENIDO PRINCIPAL -->
        <main id="mainContent">
            <div class="card">
                <h2>⏳ Cargando...</h2>
                <p>Inicializando la aplicación...</p>
            </div>
        </main>
        
        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-section="dashboard" title="Panel de control">📊</button>
            <button class="nav-item" data-section="orders" title="Pedidos">📋</button>
            <button class="nav-item" data-section="insumos" title="Insumos">🛒</button>
            <button class="nav-item" data-section="recipes" title="Recetas">📖</button>
            <button class="nav-item" data-section="productos" title="Productos">🏷️</button>
            <button class="nav-item" data-section="sales" title="Ventas">💰</button>
            <button class="nav-item" data-section="settings" title="Herramientas">⚙️</button>
            <!-- 🆕 v2.3.8 (#4): Botón de Perfil en el bottom-nav -->
            <button class="nav-item" data-section="profile" title="Mi Perfil">👤</button>
        </nav>
    </div>

    <!-- ============================================================
         SCRIPTS - MÓDULOS CORE (deben ir ANTES que los módulos que los usan)
         ============================================================ -->
    
    <!-- Módulos base -->
    <script src="./js/modal.js"></script>
    <script src="./js/db.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/profile.js"></script>
    
    <!-- Módulos auxiliares -->
    <script src="./js/notifications.js"></script>
    <script src="./js/corriente-utils.js"></script>
    
    <!-- 🆕 v2.3.7: FAQs externas (debe ir ANTES de help.js) -->
    <script src="./js/faqs.js"></script>
    
    <!-- Módulos de lógica + UI -->
    <script src="./js/orders.js"></script>
    <script src="./js/ui-orders.js"></script>
    <script src="./js/ui-insumos.js"></script>
    <script src="./js/recipes.js"></script>
    <script src="./js/ui-recipes.js"></script>
    <script src="./js/ui-productos.js"></script>
    <script src="./js/sales.js"></script>
    <script src="./js/ui-sales.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/ui-settings.js"></script>
    <script src="./js/reports.js"></script>
    <script src="./js/rewards.js"></script>
    
    <!-- 🆕 v2.3.7: Help modules (help.js ANTES que help-detailed.js) -->
    <script src="./js/help.js"></script>
    <script src="./js/help-detailed.js"></script>
    
    <!-- Controlador principal (SIEMPRE AL FINAL) -->
    <script src="./js/app.js"></script>
    
    <!-- ============================================================
         REGISTRO DEL SERVICE WORKER
         ============================================================ -->
    <script>
        (function() {
            const SW_VERSION = '2.3.9';
            
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('./sw.js', { scope: './' })
                        .then(function(registration) {
                            console.log('✅ Service Worker registrado correctamente');
                            console.log('   📦 Scope:', registration.scope);
                            
                            // Detectar actualizaciones
                            registration.addEventListener('updatefound', function() {
                                const newWorker = registration.installing;
                                console.log('🔄 Nueva versión del SW detectada. Instalando...');
                                
                                newWorker.addEventListener('statechange', function() {
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        console.log('✨ Actualización disponible');
                                        showUpdateNotification();
                                    }
                                });
                            });
                        })
                        .catch(function(error) {
                            console.error('❌ Error registrando Service Worker:', error);
                        });
                    
                    // Escuchar mensajes del SW
                    navigator.serviceWorker.addEventListener('message', function(event) {
                        if (event.data && event.data.type === 'SW_ACTIVATED') {
                            console.log(`📦 SW v${event.data.version} activado`);
                        }
                    });
                });
                
                // Detectar cuando el SW toma el control
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                    if (refreshing) return;
                    refreshing = true;
                    console.log('🔄 Service Worker actualizado, recargando...');
                    window.location.reload();
                });
            } else {
                console.warn('⚠️ Service Workers no soportados en este navegador');
            }
            
            // ============================================================
            // NOTIFICACIÓN DE ACTUALIZACIÓN DISPONIBLE
            // ============================================================
            
            function showUpdateNotification() {
                const existing = document.getElementById('sw-update-notification');
                if (existing) return;
                
                const notification = document.createElement('div');
                notification.id = 'sw-update-notification';
                notification.style.cssText = `
                    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                    background: var(--bg-card); border: 2px solid var(--primary);
                    border-radius: 12px; padding: 12px 16px;
                    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
                    z-index: 9999999; max-width: 90%; display: flex;
                    align-items: center; gap: 12px;
                    animation: slideDown 0.3s ease;
                `;
                
                notification.innerHTML = `
                    <span style="font-size: 20px;">✨</span>
                    <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 14px;">Actualización disponible</div>
                        <div style="font-size: 12px; color: var(--text-light);">Panario v${SW_VERSION}</div>
                    </div>
                    <button onclick="updateServiceWorker()" 
                            style="padding: 6px 14px; background: var(--primary); color: #fff; 
                                   border: none; border-radius: 8px; cursor: pointer; 
                                   font-weight: 600; font-size: 13px;">
                        Actualizar
                    </button>
                `;
                
                document.body.appendChild(notification);
            }
            
            window.updateServiceWorker = function() {
                const notification = document.getElementById('sw-update-notification');
                if (notification) notification.remove();
                
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
                } else {
                    window.location.reload();
                }
            };
            
            // ============================================================
            // DETECCIÓN DE ESTADO ONLINE/OFFLINE
            // ============================================================
            
            window.addEventListener('online', function() {
                console.log('🌐 Conexión restaurada');
                if (window.showToast) {
                    window.showToast('✅ Conexión restaurada', 'success', 2000);
                }
            });
            
            window.addEventListener('offline', function() {
                console.log('📴 Sin conexión a internet');
                if (window.showToast) {
                    window.showToast('📴 Trabajando sin conexión', 'warning', 3000);
                }
            });
            
            // ============================================================
            // LOG DE CARGA
            // ============================================================
            
            console.log(`📦 PWA Scripts cargados correctamente (index.html v${SW_VERSION})`);
            console.log(`   🔧 Viewport: user-scalable=5.0 (zoom permitido)`);
            console.log(`   🔧 viewport-fit=cover (safe areas respetadas)`);
            console.log(`   📚 FAQs externas: js/faqs.js`);
            console.log(`   📖 Help modules: help.js + help-detailed.js`);
            console.log(`   🚪 Botón cerrar sesión en header (extremo derecho)`);
            console.log(`   👤 Botón Mi Perfil en bottom-nav (extremo derecho)`);
            console.log(`   🔔 IDs corregidos: notification-bell + bell-badge (#2)`);
        })();
    </script>
    
</body>
</html>
