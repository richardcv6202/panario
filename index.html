                <div id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginUser">👤 Usuario</label>
                        <input type="text" id="loginUser" placeholder="Ej: richard_pan" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="loginPass">🔒 Contraseña</label>
                        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <button id="loginBtn" class="btn primary">Iniciar sesión</button>
                    <button id="showRegisterBtn" class="btn secondary">📝 Registrarme</button>
                    <div id="loginError" class="error"></div>
                </div>

                <div id="registerForm" class="auth-form" style="display:none">
                    <div class="form-group">
                        <label for="regUser">👤 Usuario</label>
                        <input type="text" id="regUser" placeholder="Elige un nombre de usuario" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="regPass">🔒 Contraseña</label>
                        <input type="password" id="regPass" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="regName">📛 Nombre completo</label>
                        <input type="text" id="regName" placeholder="Tu nombre y apellidos">
                    </div>
                    
                    <!-- 🆕 SELECCIÓN DE MODO DE NEGOCIO -->
                    <div class="form-group">
                        <label>🏢 Modo de negocio</label>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <label class="negocio-mode-option" 
                                   style="flex: 1; min-width: 120px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--primary); cursor: pointer; text-align: center; background: var(--primary-light); transition: all 0.2s;"
                                   onclick="selectNegocioMode('crear')">
                                <input type="radio" name="negocioMode" value="crear" checked style="display: none;">
                                <div style="font-size: 24px; margin-bottom: 4px;">🆕</div>
                                <div style="font-size: 13px; font-weight: 600;">Crear negocio</div>
                                <div style="font-size: 10px; color: var(--text-light);">Soy el administrador</div>
                            </label>
                            <label class="negocio-mode-option"
                                   style="flex: 1; min-width: 120px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--border-color); cursor: pointer; text-align: center; background: var(--bg); transition: all 0.2s;"
                                   onclick="selectNegocioMode('unirse')">
                                <input type="radio" name="negocioMode" value="unirse" style="display: none;">
                                <div style="font-size: 24px; margin-bottom: 4px;">🔗</div>
                                <div style="font-size: 13px; font-weight: 600;">Unirme a uno</div>
                                <div style="font-size: 10px; color: var(--text-light);">Tengo un código</div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Campo para NOMBRE DEL NEGOCIO (visible si "crear") -->
                    <div class="form-group" id="negocio-name-group">
                        <label for="regBusiness">🏪 Nombre del negocio</label>
                        <input type="text" id="regBusiness" placeholder="Ej: Panadería La Esquina">
                    </div>
                    
                    <!-- Campo para CÓDIGO DE INVITACIÓN (visible si "unirse") -->
                    <div class="form-group" id="negocio-code-group" style="display: none;">
                        <label for="regCodigo">🔑 Código de invitación</label>
                        <input type="text" id="regCodigo" placeholder="Ej: ABC12345" maxlength="8" 
                               style="text-transform: uppercase; letter-spacing: 2px; font-weight: 600;"
                               oninput="previewNegocio(this.value)">
                        <div id="negocio-preview" style="margin-top: 6px; font-size: 12px;"></div>
                        <small style="font-size: 11px; color: var(--text-light);">Pídele el código al administrador del negocio</small>
                    </div>
                    
                    <button id="registerBtn" class="btn primary">Crear cuenta</button>
                    <button id="showLoginBtn" class="btn secondary">← Ya tengo cuenta</button>
                    <div id="registerError" class="error"></div>
                </div>

                <div class="auth-footer">
                    <small>💾 Datos guardados localmente en tu dispositivo</small>
                </div>
            </div>

                     onmouseover="this.style.background='var(--bg)'" 
                     onmouseout="this.style.background='transparent'"

                     style="cursor: pointer; font-size: 20px; padding: 4px 8px; border-radius: 8px; transition: all 0.2s; color: var(--text);" 
                     title="Centro de Ayuda"
                     onmouseover="this.style.background='var(--bg)'" 
                     onmouseout="this.style.background='transparent'">

                <!-- AVATAR Y NOMBRE DE USUARIO -->

                </span>
                
                <!-- BOTÓN DE CERRAR SESIÓN -->
                <button id="logoutHeaderBtn" onclick="handleLogout()" class="icon-btn" title="Cerrar sesión" style="background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.2s; color: var(--text); display: flex; align-items: center; gap: 4px;">

    <!-- ============================================================ -->
    <!-- 🆕 SERVICE WORKER - REGISTRO Y ACTUALIZACIÓN                 -->
    <!-- ============================================================ -->
    <script>
    // ============================================================
    // SERVICE WORKER REGISTRATION - Panario v2.1.11
    // ============================================================
    // Registra el SW con ruta RELATIVA (./sw.js) para que funcione
    // tanto en localhost como en GitHub Pages (subcarpeta).
    //
    // - Detecta nuevas versiones del SW y avisa al usuario.
    // - Maneja errores sin bloquear la app.
    // - Solo registra en contextos seguros (HTTPS o localhost).
    // - 🆕 ENTREGA 1: Escucha mensajes CACHE_REPAIRED_START/END
    // ============================================================
    
    (function() {
        'use strict';
        
        // ============================================================
        // VERIFICAR SOPORTE
        // ============================================================
        if (!('serviceWorker' in navigator)) {
            console.log('ℹ️ Service Worker no soportado en este navegador');
            return;
        }
        
        // ============================================================
        // VERIFICAR CONTEXTO SEGURO
        // ============================================================
        const isSecureContext = (
            window.location.protocol === 'https:' ||
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname === '[::1]'
        );
        
        if (!isSecureContext) {
            console.log('ℹ️ Service Worker solo se registra en HTTPS o localhost');
            return;
        }
        
        // ============================================================
        // REGISTRAR SERVICE WORKER
        // ============================================================
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js', {
                scope: './'
            })
            .then(function(registration) {
                console.log('✅ Service Worker registrado correctamente');
                console.log('   📍 Scope:', registration.scope);
                
                // ============================================================
                // 🆕 ENTREGA 1: ESCUCHAR MENSAJES DEL SW
                // ============================================================
                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (!event.data) return;
                    
                    // ---- CACHE_REPAIRED_START ----
                    if (event.data.type === 'CACHE_REPAIRED_START') {
                        console.log(`🔧 SW: Iniciando reparación de caché (${event.data.total} assets)...`);
                        // Avisar al usuario con toast
                        if (window.showToast) {
                            window.showToast(
                                `🔧 Reparando caché (${event.data.total} archivos)...`,
                                'info',
                                3000
                            );
                        }
                    }
                    
                    // ---- CACHE_REPAIRED_END ----
                    if (event.data.type === 'CACHE_REPAIRED_END') {
                        console.log(`✅ SW: Caché reparado (${event.data.downloaded} OK, ${event.data.failed} fallidos)`);
                        if (window.showToast) {
                            if (event.data.failed === 0) {
                                window.showToast(
                                    `✅ Caché reparado correctamente (${event.data.downloaded} archivos)`,
                                    'success',
                                    4000
                                );
                            } else {
                                window.showToast(
                                    `⚠️ Caché parcialmente reparado (${event.data.downloaded} OK, ${event.data.failed} fallidos)`,
                                    'warning',
                                    5000
                                );
                            }
                        }
                    }
                    
                    // ---- CACHE_REPAIRED (compatibilidad v2.1.10) ----
                    if (event.data.type === 'CACHE_REPAIRED') {
                        console.log(`✅ SW: Caché reparado (compatibilidad v2.1.10)`);
                    }
                    
                    // ---- INTEGRITY_RESULT ----
                    if (event.data.type === 'INTEGRITY_RESULT') {
                        console.log(`🔍 SW: Integridad verificada:`, event.data);
                    }
                });
                
                // ============================================================
                // DETECTAR ACTUALIZACIONES DEL SERVICE WORKER
                // ============================================================
                registration.addEventListener('updatefound', function() {
                    const newWorker = registration.installing;
                    if (!newWorker) return;
                    
                    console.log('🔄 Nueva versión del SW detectada, instalando...');
                    
                    newWorker.addEventListener('statechange', function() {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            console.log('✨ Nueva versión lista. Mostrando aviso al usuario.');
                            
                            setTimeout(function() {
                                if (window.ModalModule && window.ModalModule.showConfirm) {
                                    window.ModalModule.showConfirm({
                                        title: '✨ Actualización disponible',
                                        message: 'Hay una nueva versión de Panario disponible.\n\n¿Quieres actualizar ahora?\n\nSe recargará la página.',
                                        confirmText: '🔄 Sí, actualizar',
                                        cancelText: '⏰ Más tarde',
                                        icon: '✨',
                                        confirmColor: '#f5a623'
                                    }).then(function(confirm) {
                                        if (confirm) {
                                            newWorker.postMessage({ type: 'SKIP_WAITING' });
                                            
                                            let refreshing = false;
                                            navigator.serviceWorker.addEventListener('controllerchange', function() {
                                                if (refreshing) return;
                                                refreshing = true;
                                                window.location.reload();
                                            });
                                            
                                            setTimeout(function() {
                                                if (!refreshing) {
                                                    refreshing = true;
                                                    window.location.reload();
                                                }
                                            }, 3000);
                                        }
                                    });
                                } else if (window.confirm) {
                                    if (window.confirm('✨ Nueva versión de Panario disponible.\n\n¿Actualizar ahora?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        setTimeout(function() {
                                            window.location.reload();
                                        }, 500);
                                    }
                                }
                            }, 1500);
                        }
                    });
                });
                
                // ============================================================
                // VERIFICAR ACTUALIZACIONES CADA 30 MINUTOS
                // ============================================================
                setInterval(function() {
                    registration.update().catch(function(err) {
                        // Silenciar errores de actualización
                    });
                }, 30 * 60 * 1000);
                
                // ============================================================
                // VERIFICAR ACTUALIZACIONES AL VOLVER A LA PESTAÑA
                // ============================================================
                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(function() {});
                    }
                });
                
            })
            .catch(function(error) {
                console.warn('⚠️ Error registrando Service Worker:', error.message);
                console.warn('   La app funcionará sin modo offline.');
            });
        });
        
        // ============================================================
        // MANEJO DE CAMBIOS DE CONTROLADOR
        // ============================================================
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (refreshing) return;
            console.log('🔧 Service Worker ahora controla la página');
        });
        
        // ============================================================
        // VERIFICAR SI HAY ACTUALIZACIONES PENDIENTES AL CARGAR
        // ============================================================
        navigator.serviceWorker.ready.then(function(registration) {
            console.log('✅ Service Worker listo');
            console.log('   📦 Scope:', registration.scope);
            console.log('   🎯 Estado:', registration.active ? 'activo' : 'inactivo');
        });
        
    })();
    
    // ============================================================
    // PROCESAR PARÁMETRO ?section= DE LA URL (Shortcuts del manifest)
    // ============================================================
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const sectionParam = urlParams.get('section');
        
        if (sectionParam) {
            console.log('🧭 Sección solicitada por URL:', sectionParam);
            
            window._pendingSection = sectionParam;
            
            const cleanUrl = window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
            
            document.addEventListener('panario:logged-in', function() {
                setTimeout(function() {
                    if (window._pendingSection && window.navigate) {
                        console.log('🧭 Navegando a sección pendiente:', window._pendingSection);
                        window.navigate(window._pendingSection);
                        window._pendingSection = null;
                    }
                }, 500);
            });
        }
    })();
    
    // ============================================================
    // PWA: MANEJO DE INSTALACIÓN (beforeinstallprompt)
    // ============================================================
    (function() {
        let deferredPrompt = null;
        
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            
            deferredPrompt = e;
            
            console.log('📱 PWA: Disponible para instalar');
            
            window._installPWA = function() {
                if (!deferredPrompt) {
                    console.log('ℹ️ PWA: No hay prompt de instalación disponible');
                    return false;
                }
                
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function(choiceResult) {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('✅ PWA: Usuario aceptó la instalación');
                        if (window.showToast) {
                            window.showToast('✅ Panario instalado correctamente', 'success', 3000);
                        }
                    } else {
                        console.log('ℹ️ PWA: Usuario canceló la instalación');
                    }
                    deferredPrompt = null;
                });
                
                return true;
            };
        });
        
        // ============================================================
        // DETECTAR SI YA ESTÁ INSTALADA
        // ============================================================
        window.addEventListener('appinstalled', function() {
            console.log('✅ PWA: Panario instalado');
            deferredPrompt = null;
        });
        
        // ============================================================
        // DETECTAR MODO STANDALONE (ya instalada)
        // ============================================================
        if (window.matchMedia('(display-mode: standalone)').matches || 
            window.navigator.standalone === true) {
            console.log('📱 PWA: Ejecutándose en modo standalone (instalada)');
            document.documentElement.setAttribute('data-pwa-installed', 'true');
        }
    })();
    
    // ============================================================
    // PWA: DETECTAR CAMBIOS DE CONECTIVIDAD
    // ============================================================
    (function() {
        window.addEventListener('online', function() {
            console.log('🌐 Conexión restaurada');
            if (window.showToast) {
